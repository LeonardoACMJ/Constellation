<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
<title id="title">Overlapping radial navigation</title>
<desc id="desc">A child fan extends to the right, with its center offset approximately half the parent radius. Its inner boundary begins inside the parent circle, and its outer boundary extends beyond it. Dimensions are illustrative.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#adc0e4"/></marker></defs>
<rect width="900" height="370" rx="14" fill="#111827"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#e2e8f0">
<text x="26" y="31" font-size="15">ILLUSTRATIVE STACKING GEOMETRY · LAY-02 / LAY-03</text>
<circle cx="200" cy="195" r="130" fill="#202e48" stroke="#8198bd" stroke-width="2"/>
<g stroke="#596d90"><path d="M200 195L200 65M200 195L87.4 130M200 195L87.4 260M200 195L200 325M200 195L312.6 260M200 195L312.6 130"/></g>
<path d="M312.6 130A130 130 0 0 1 312.6 260L200 195Z" fill="#6b559f" opacity=".8" stroke="#c4b5fd"/>
<path d="M310.0 51.3 A149.5 149.5 0 0 1 310.0 338.7 L288.8 267.5 A75.4 75.4 0 0 0 288.8 122.5 Z" fill="#443963" stroke="#c4b5fd" stroke-width="2"/>
<g stroke="#aa93cf"><path d="M304.5 129.7L340.9 65.5M335.4 162.9L403.1 131.3M342.0 195L417.1 195M335.4 227.1L403.1 258.7M304.5 260.3L340.9 324.5"/></g>
<circle cx="200" cy="195" r="35" fill="#111827" stroke="#8198bd"/>
<text x="200" y="199" text-anchor="middle" font-size="11">ROOT</text>
<circle cx="267.6" cy="195" r="4" fill="#d8b4fe"/>
<path d="M200 241L267.6 241" stroke="#adc0e4" marker-end="url(#arrow)"/>
<text x="233.8" y="262" text-anchor="middle" font-size="12">≈ ½ R</text>
<path d="M389 102L500 83" stroke="#adc0e4" fill="none"/>
<text x="515" y="80" font-size="16" fill="#d8b4fe">Child fan</text>
<text x="515" y="103" font-size="13" fill="#aebed7">Extends outward in the parent's direction.</text>
<path d="M313 170L498 163" stroke="#adc0e4" fill="none"/>
<text x="515" y="163" font-size="16">Overlap region</text>
<text x="515" y="186" font-size="13" fill="#aebed7">Child begins within the parent's footprint.</text>
<text x="515" y="245" font-size="16">Further levels repeat the pattern.</text>
<text x="515" y="270" font-size="13" fill="#aebed7">Exact angles, scaling, and edge handling</text>
<text x="515" y="290" font-size="13" fill="#aebed7">remain proposals in the spec.</text>
<text x="26" y="351" font-size="11" fill="#95a9c7">R = parent radius · dots mark root and child centers · diagram is not a final visual design</text>
</g></svg>
