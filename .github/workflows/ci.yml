name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: resolve
        name: Resolve exact-commit qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_qualification.py resolve

  core:
    needs: qualification
    if: needs.qualification.outputs.reuse != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Correctness lints
        run: cargo clippy --locked --all-targets -- -A warnings -D clippy::correctness
      - name: Release documents and links
        run: python scripts/check_release.py
      - name: CI qualification regression checks
        run: python -m unittest discover -s tests -p "test_ci_qualification.py"
      - run: cargo test --locked
      - run: cargo fmt --all --check
      - name: Native menu and dialog regressions
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: |
          cargo test --lib lifecycle_tests --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib native_modal_tests --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib render_tests --locked -- --ignored --test-threads=1
      - name: Build Windows portable binary
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Package portable folder
        if: runner.os == 'Windows'
        run: python scripts/package.py
      - name: Verify embedded application icon
        if: runner.os == 'Windows'
        run: python scripts/check_icons.py
      - name: Verify packaged build and documents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          python scripts/check_release.py --archive "dist/Constellation-$version-windows-x64.zip"
      - name: Save portable archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Constellation-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Save offscreen rendering review
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Constellation-render-review
          path: .local/render-review/
          if-no-files-found: ignore

  reuse-qualified-build:
    needs: qualification
    if: needs.qualification.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the qualified exact-commit package
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.qualification.outputs.run_id }}
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name Constellation-windows-x64 --dir dist
      - name: Recheck qualification and package integrity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.qualification.outputs.run_id }}
        run: python scripts/ci_qualification.py verify --run-id "$SOURCE_RUN"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Constellation-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
