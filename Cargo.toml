[package]
name = "constellation"
version = "0.1.13"
edition = "2024"
description = "Portable system-tray radial launcher"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["unbounded_depth"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_Security",
  "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_System_RemoteDesktop",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
